<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#141414">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>VIBE Scanner</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,600;0,700;1,700&family=Barlow+Condensed:ital,wght@0,700;1,700&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #141414;
      color: rgba(255,255,255,0.95);
      font-family: 'Barlow', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
    }

    .screen-fullscreen {
      position: fixed;
      inset: 0;
      background: #141414;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
      z-index: 100;
    }

    .vibe-logo {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 3rem;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
    }
    .vibe-logo .word-1 { color: rgba(255,255,255,0.95); }
    .vibe-logo .word-2 { color: #6ab04c; font-style: italic; }

    .vibe-subtitle {
      font-size: 0.85rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      opacity: 0.5;
      margin-bottom: 3rem;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #6ab04c;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 1.5rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .screen-message { font-size: 1rem; opacity: 0.7; max-width: 320px; line-height: 1.4; }
    .error-icon { font-size: 3rem; margin-bottom: 1rem; }
    .error-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 2rem;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: -0.01em;
    }
    .error-message { font-size: 1rem; opacity: 0.7; max-width: 320px; line-height: 1.4; }

    .scanner-app {
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
      position: relative;
    }

    .header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: env(safe-area-inset-top, 0) 1rem 0.75rem;
      padding-top: calc(env(safe-area-inset-top, 0) + 0.75rem);
      background: linear-gradient(180deg, rgba(20,20,20,0.95) 0%, rgba(20,20,20,0.6) 80%, transparent 100%);
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .header-left .event-name {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 1.1rem;
      line-height: 1.1;
      text-transform: uppercase;
      letter-spacing: -0.01em;
    }

    .header-left .staff-name {
      font-size: 0.75rem;
      opacity: 0.6;
      margin-top: 2px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .header-right { display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }

    .scan-counter, .stats-pill {
      background: rgba(106,176,76,0.15);
      border: 1px solid rgba(106,176,76,0.4);
      color: #6ab04c;
      padding: 0.3rem 0.6rem;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
    }
    .stats-pill { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.2); color: rgba(255,255,255,0.9); }

    .camera-container {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: #000;
    }

    #qr-reader { width: 100%; height: 100%; }
    #qr-reader video { width: 100% !important; height: 100% !important; object-fit: cover !important; }

    #qr-reader__dashboard,
    #qr-reader__header_message,
    #qr-reader__camera_selection,
    #qr-reader__filescan_input,
    #qr-reader__status_span,
    #qr-reader__dashboard_section_csr button,
    #qr-reader__dashboard_section_swaplink {
      display: none !important;
    }
    #qr-reader__scan_region img { display: none !important; }
    #qr-reader__scan_region { background: transparent !important; }

    .scan-frame {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 70vw;
      max-width: 280px;
      aspect-ratio: 1;
      pointer-events: none;
      z-index: 5;
    }

    .scan-frame::before,
    .scan-frame::after,
    .scan-frame > .corner-bl,
    .scan-frame > .corner-br {
      content: '';
      position: absolute;
      width: 30px;
      height: 30px;
      border-color: #6ab04c;
      border-style: solid;
      border-width: 0;
    }
    .scan-frame::before { top: 0; left: 0; border-top-width: 3px; border-left-width: 3px; }
    .scan-frame::after { top: 0; right: 0; border-top-width: 3px; border-right-width: 3px; }
    .scan-frame .corner-bl { bottom: 0; left: 0; border-bottom-width: 3px; border-left-width: 3px; }
    .scan-frame .corner-br { bottom: 0; right: 0; border-bottom-width: 3px; border-right-width: 3px; }

    .scan-line {
      position: absolute;
      left: 5%;
      right: 5%;
      height: 2px;
      background: linear-gradient(90deg, transparent, #6ab04c, transparent);
      box-shadow: 0 0 8px #6ab04c;
      animation: scanMove 2s ease-in-out infinite;
    }
    @keyframes scanMove {
      0%, 100% { top: 5%; }
      50% { top: calc(100% - 5%); }
    }

    .scan-hint {
      position: absolute;
      bottom: 30%;
      left: 0;
      right: 0;
      text-align: center;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      opacity: 0.8;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
      z-index: 5;
    }

    .result-banner {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 1.5rem 1.25rem;
      padding-bottom: calc(env(safe-area-inset-bottom, 0) + 1.5rem);
      transform: translateY(100%);
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 20;
      min-height: 30vh;
    }
    .result-banner.visible { transform: translateY(0); }
    .result-banner.success { background: linear-gradient(180deg, #6ab04c 0%, #5a9c3f 100%); color: #fff; }
    .result-banner.warning { background: linear-gradient(180deg, #f5a623 0%, #d68910 100%); color: #141414; }
    .result-banner.error { background: linear-gradient(180deg, #d63031 0%, #b02525 100%); color: #fff; }

    .result-icon {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 4rem;
      line-height: 1;
      margin-bottom: 0.5rem;
    }
    .result-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 2.5rem;
      line-height: 1;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      margin-bottom: 0.75rem;
    }
    .result-attendee {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 1.5rem;
      line-height: 1.1;
      margin-bottom: 0.25rem;
    }
    .result-meta { font-size: 0.9rem; opacity: 0.85; line-height: 1.3; }
    .result-countdown {
      position: absolute;
      bottom: 0.5rem;
      right: 1rem;
      font-size: 0.7rem;
      opacity: 0.6;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .status-pulse {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 70vw;
      max-width: 280px;
      aspect-ratio: 1;
      border-radius: 12px;
      pointer-events: none;
      z-index: 4;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .status-pulse.success { background: rgba(106,176,76,0.3); opacity: 1; }
    .status-pulse.warning { background: rgba(245,166,35,0.3); opacity: 1; }
    .status-pulse.error { background: rgba(214,48,49,0.35); opacity: 1; }

    .manual-btn {
      position: absolute;
      bottom: calc(env(safe-area-inset-bottom, 0) + 1rem);
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.25);
      color: rgba(255,255,255,0.95);
      padding: 0.75rem 1.5rem;
      border-radius: 100px;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      z-index: 9;
      cursor: pointer;
      font-family: 'Barlow', sans-serif;
    }
    .manual-btn:active { transform: translateX(-50%) scale(0.96); }

    /* ==================== MANUAL OVERLAY ==================== */
    .manual-overlay {
      position: fixed;
      inset: 0;
      background: #141414;
      z-index: 50;
      display: flex;
      flex-direction: column;
      transform: translateY(100%);
      transition: transform 0.3s ease;
    }
    .manual-overlay.visible { transform: translateY(0); }

    .manual-header {
      padding: calc(env(safe-area-inset-top, 0) + 0.75rem) 1rem 0.75rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .manual-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 1.5rem;
      letter-spacing: -0.01em;
      text-transform: uppercase;
    }
    .manual-title .word-2 { color: #6ab04c; font-style: italic; }

    .manual-close {
      background: rgba(255,255,255,0.08);
      border: none;
      color: rgba(255,255,255,0.95);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .stats-bar {
      padding: 1rem;
      background: rgba(255,255,255,0.03);
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .stats-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 0.5rem;
    }
    .stats-label {
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      opacity: 0.5;
    }
    .stats-value {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 1.3rem;
    }
    .stats-value .accent { color: #6ab04c; }
    .stats-progress {
      height: 6px;
      background: rgba(255,255,255,0.08);
      border-radius: 3px;
      overflow: hidden;
    }
    .stats-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #6ab04c, #8bc34a);
      width: 0%;
      transition: width 0.4s ease;
    }
    .stats-meta {
      display: flex;
      gap: 1rem;
      margin-top: 0.5rem;
      font-size: 0.75rem;
      opacity: 0.6;
    }
    .stats-meta span strong { color: rgba(255,255,255,0.95); font-weight: 700; }

    .search-wrap {
      padding: 1rem;
    }
    .search-input {
      width: 100%;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.95);
      padding: 0.85rem 1rem;
      border-radius: 8px;
      font-size: 1rem;
      font-family: 'Barlow', sans-serif;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-input:focus { border-color: #6ab04c; }
    .search-input::placeholder { color: rgba(255,255,255,0.4); }

    .results-list {
      flex: 1;
      overflow-y: auto;
      padding: 0 1rem 2rem;
      -webkit-overflow-scrolling: touch;
    }

    .result-item {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 0.85rem;
      margin-bottom: 0.6rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
    }

    .result-item-info { flex: 1; min-width: 0; }
    .result-item-name {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 1.1rem;
      line-height: 1.1;
      margin-bottom: 2px;
    }
    .result-item-meta {
      font-size: 0.75rem;
      opacity: 0.6;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .result-item-status {
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-top: 4px;
      font-weight: 600;
    }
    .result-item-status.used { color: #f5a623; }
    .result-item-status.void { color: #d63031; }
    .result-item-status.no_ticket { color: rgba(255,255,255,0.4); }
    .result-item-status.valid { color: #6ab04c; }

    .result-item-action {
      background: #6ab04c;
      color: #fff;
      border: none;
      padding: 0.6rem 0.9rem;
      border-radius: 8px;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      cursor: pointer;
      flex-shrink: 0;
    }
    .result-item-action:active { transform: scale(0.96); }
    .result-item-action.disabled {
      background: rgba(255,255,255,0.06);
      color: rgba(255,255,255,0.3);
      cursor: not-allowed;
    }
    .result-item-action.processing {
      background: rgba(106,176,76,0.4);
      cursor: wait;
    }

    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      opacity: 0.5;
      font-size: 0.9rem;
    }

    /* Toast result inside manual overlay */
    .toast {
      position: fixed;
      top: calc(env(safe-area-inset-top, 0) + 1rem);
      left: 1rem;
      right: 1rem;
      padding: 1rem;
      border-radius: 10px;
      z-index: 1000;
      transform: translateY(-150%);
      transition: transform 0.3s ease;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    .toast.visible { transform: translateY(0); }
    .toast.success { background: #6ab04c; color: #fff; }
    .toast.warning { background: #f5a623; color: #141414; }
    .toast.error { background: #d63031; color: #fff; }
    .toast-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 1.2rem;
      letter-spacing: -0.01em;
      text-transform: uppercase;
    }
    .toast-message { font-size: 0.85rem; opacity: 0.95; margin-top: 2px; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div id="screen-loading" class="screen-fullscreen">
    <div class="vibe-logo">
      <span class="word-1">VIBE</span><span class="word-2">.</span>
    </div>
    <div class="vibe-subtitle">Scanner</div>
    <div class="spinner"></div>
    <div class="screen-message">Validando acceso...</div>
  </div>

  <div id="screen-error" class="screen-fullscreen hidden">
    <div class="vibe-logo">
      <span class="word-1">ACCESO</span><span class="word-2"> denegado.</span>
    </div>
    <div class="error-icon">🚫</div>
    <div class="error-title" id="error-title">No autorizado</div>
    <div class="error-message" id="error-message">Tu link no es válido.</div>
  </div>

  <div id="screen-scanner" class="scanner-app hidden">
    <div class="header">
      <div class="header-left">
        <div class="event-name" id="event-name">—</div>
        <div class="staff-name" id="staff-name">—</div>
      </div>
      <div class="header-right">
        <div class="scan-counter" id="scan-counter">0 scans</div>
      </div>
    </div>

    <div class="camera-container">
      <div id="qr-reader"></div>

      <div class="scan-frame">
        <span class="corner-bl"></span>
        <span class="corner-br"></span>
        <div class="scan-line"></div>
      </div>

      <div class="status-pulse" id="status-pulse"></div>

      <div class="scan-hint" id="scan-hint">Apuntá al QR</div>

      <button class="manual-btn" id="btn-manual">🔍 Buscar manual</button>
    </div>

    <div class="result-banner" id="result-banner">
      <div class="result-icon" id="result-icon"></div>
      <div class="result-title" id="result-title"></div>
      <div class="result-attendee" id="result-attendee"></div>
      <div class="result-meta" id="result-meta"></div>
      <div class="result-countdown" id="result-countdown"></div>
    </div>
  </div>

  <!-- ============ MANUAL OVERLAY ============ -->
  <div id="manual-overlay" class="manual-overlay">
    <div class="manual-header">
      <div class="manual-title">
        BUSCAR <span class="word-2">manual.</span>
      </div>
      <button class="manual-close" id="btn-close-manual">✕</button>
    </div>

    <div class="stats-bar" id="stats-bar">
      <div class="stats-row">
        <div class="stats-label">Ingresos</div>
        <div class="stats-value">
          <span class="accent" id="stats-used">0</span> / <span id="stats-total">0</span>
        </div>
      </div>
      <div class="stats-progress">
        <div class="stats-progress-fill" id="stats-fill"></div>
      </div>
      <div class="stats-meta">
        <span><strong id="stats-pct">0%</strong> ingresado</span>
        <span>Mis scans: <strong id="stats-mine">0</strong></span>
      </div>
    </div>

    <div class="search-wrap">
      <input
        type="text"
        class="search-input"
        id="search-input"
        placeholder="Nombre, email, depto..."
        autocomplete="off"
        autocapitalize="off"
        spellcheck="false"
      >
    </div>

    <div class="results-list" id="results-list">
      <div class="empty-state">Escribí al menos 2 letras</div>
    </div>

    <div class="toast" id="manual-toast">
      <div class="toast-title" id="toast-title"></div>
      <div class="toast-message" id="toast-message"></div>
    </div>
  </div>

  <script src="../js/scanner.js"></script>
</body>
</html>
