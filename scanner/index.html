<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#141414">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>VIBE Scanner</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,600;0,700;1,700&family=Barlow+Condensed:ital,wght@0,700;1,700&display=swap" rel="stylesheet">

  <!-- Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #141414;
      color: rgba(255,255,255,0.95);
      font-family: 'Barlow', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
    }

    /* ==================== LOADING / ERROR SCREENS ==================== */
    .screen-fullscreen {
      position: fixed;
      inset: 0;
      background: #141414;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
      z-index: 100;
    }

    .vibe-logo {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 3rem;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
    }
    .vibe-logo .word-1 { color: rgba(255,255,255,0.95); }
    .vibe-logo .word-2 { color: #6ab04c; font-style: italic; }

    .vibe-subtitle {
      font-size: 0.85rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      opacity: 0.5;
      margin-bottom: 3rem;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #6ab04c;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 1.5rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .screen-message {
      font-size: 1rem;
      opacity: 0.7;
      max-width: 320px;
      line-height: 1.4;
    }

    .error-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
    }

    .error-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 2rem;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: -0.01em;
    }

    .error-message {
      font-size: 1rem;
      opacity: 0.7;
      max-width: 320px;
      line-height: 1.4;
    }

    /* ==================== SCANNER MAIN ==================== */
    .scanner-app {
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
      position: relative;
    }

    .header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: env(safe-area-inset-top, 0) 1rem 0.75rem;
      padding-top: calc(env(safe-area-inset-top, 0) + 0.75rem);
      background: linear-gradient(180deg, rgba(20,20,20,0.95) 0%, rgba(20,20,20,0.6) 80%, transparent 100%);
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .header-left .event-name {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 1.1rem;
      line-height: 1.1;
      text-transform: uppercase;
      letter-spacing: -0.01em;
    }

    .header-left .staff-name {
      font-size: 0.75rem;
      opacity: 0.6;
      margin-top: 2px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .header-right .scan-counter {
      background: rgba(106,176,76,0.15);
      border: 1px solid rgba(106,176,76,0.4);
      color: #6ab04c;
      padding: 0.3rem 0.6rem;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    /* Camera area */
    .camera-container {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: #000;
    }

    #qr-reader {
      width: 100%;
      height: 100%;
    }

    #qr-reader video {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
    }

    /* Hide html5-qrcode default UI */
    #qr-reader__dashboard,
    #qr-reader__header_message,
    #qr-reader__camera_selection,
    #qr-reader__filescan_input,
    #qr-reader__status_span,
    #qr-reader__dashboard_section_csr button,
    #qr-reader__dashboard_section_swaplink {
      display: none !important;
    }
    #qr-reader__scan_region img { display: none !important; }
    #qr-reader__scan_region { background: transparent !important; }

    /* Custom scan frame */
    .scan-frame {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 70vw;
      max-width: 280px;
      aspect-ratio: 1;
      pointer-events: none;
      z-index: 5;
    }

    .scan-frame::before,
    .scan-frame::after,
    .scan-frame > .corner-bl,
    .scan-frame > .corner-br {
      content: '';
      position: absolute;
      width: 30px;
      height: 30px;
      border-color: #6ab04c;
      border-style: solid;
      border-width: 0;
    }
    .scan-frame::before { top: 0; left: 0; border-top-width: 3px; border-left-width: 3px; }
    .scan-frame::after { top: 0; right: 0; border-top-width: 3px; border-right-width: 3px; }
    .scan-frame .corner-bl { bottom: 0; left: 0; border-bottom-width: 3px; border-left-width: 3px; }
    .scan-frame .corner-br { bottom: 0; right: 0; border-bottom-width: 3px; border-right-width: 3px; }

    .scan-line {
      position: absolute;
      left: 5%;
      right: 5%;
      height: 2px;
      background: linear-gradient(90deg, transparent, #6ab04c, transparent);
      box-shadow: 0 0 8px #6ab04c;
      animation: scanMove 2s ease-in-out infinite;
    }
    @keyframes scanMove {
      0%, 100% { top: 5%; }
      50% { top: calc(100% - 5%); }
    }

    .scan-hint {
      position: absolute;
      bottom: 30%;
      left: 0;
      right: 0;
      text-align: center;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      opacity: 0.8;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
      z-index: 5;
    }

    /* ==================== RESULT BANNER ==================== */
    .result-banner {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 1.5rem 1.25rem;
      padding-bottom: calc(env(safe-area-inset-bottom, 0) + 1.5rem);
      transform: translateY(100%);
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 20;
      min-height: 30vh;
    }

    .result-banner.visible {
      transform: translateY(0);
    }

    .result-banner.success {
      background: linear-gradient(180deg, #6ab04c 0%, #5a9c3f 100%);
      color: #fff;
    }
    .result-banner.warning {
      background: linear-gradient(180deg, #f5a623 0%, #d68910 100%);
      color: #141414;
    }
    .result-banner.error {
      background: linear-gradient(180deg, #d63031 0%, #b02525 100%);
      color: #fff;
    }

    .result-icon {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 4rem;
      line-height: 1;
      margin-bottom: 0.5rem;
    }

    .result-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 2.5rem;
      line-height: 1;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      margin-bottom: 0.75rem;
    }

    .result-attendee {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 1.5rem;
      line-height: 1.1;
      margin-bottom: 0.25rem;
    }

    .result-meta {
      font-size: 0.9rem;
      opacity: 0.85;
      line-height: 1.3;
    }

    .result-countdown {
      position: absolute;
      bottom: 0.5rem;
      right: 1rem;
      font-size: 0.7rem;
      opacity: 0.6;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    /* Status pulse */
    .status-pulse {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 70vw;
      max-width: 280px;
      aspect-ratio: 1;
      border-radius: 12px;
      pointer-events: none;
      z-index: 4;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .status-pulse.success { background: rgba(106,176,76,0.3); opacity: 1; }
    .status-pulse.warning { background: rgba(245,166,35,0.3); opacity: 1; }
    .status-pulse.error { background: rgba(214,48,49,0.35); opacity: 1; }

    /* Manual button */
    .manual-btn {
      position: absolute;
      bottom: calc(env(safe-area-inset-bottom, 0) + 1rem);
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.2);
      color: rgba(255,255,255,0.95);
      padding: 0.6rem 1.2rem;
      border-radius: 100px;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      z-index: 9;
      cursor: pointer;
    }

    /* Hidden helper */
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- LOADING SCREEN -->
  <div id="screen-loading" class="screen-fullscreen">
    <div class="vibe-logo">
      <span class="word-1">VIBE</span><span class="word-2">.</span>
    </div>
    <div class="vibe-subtitle">Scanner</div>
    <div class="spinner"></div>
    <div class="screen-message">Validando acceso...</div>
  </div>

  <!-- ERROR SCREEN -->
  <div id="screen-error" class="screen-fullscreen hidden">
    <div class="vibe-logo">
      <span class="word-1">ACCESO</span><span class="word-2"> denegado.</span>
    </div>
    <div class="error-icon">🚫</div>
    <div class="error-title" id="error-title">No autorizado</div>
    <div class="error-message" id="error-message">Tu link no es válido.</div>
  </div>

  <!-- SCANNER APP -->
  <div id="screen-scanner" class="scanner-app hidden">
    <div class="header">
      <div class="header-left">
        <div class="event-name" id="event-name">—</div>
        <div class="staff-name" id="staff-name">—</div>
      </div>
      <div class="header-right">
        <div class="scan-counter" id="scan-counter">0 scans</div>
      </div>
    </div>

    <div class="camera-container">
      <div id="qr-reader"></div>

      <div class="scan-frame">
        <span class="corner-bl"></span>
        <span class="corner-br"></span>
        <div class="scan-line"></div>
      </div>

      <div class="status-pulse" id="status-pulse"></div>

      <div class="scan-hint" id="scan-hint">Apuntá al QR</div>
    </div>

    <!-- Result banner -->
    <div class="result-banner" id="result-banner">
      <div class="result-icon" id="result-icon"></div>
      <div class="result-title" id="result-title"></div>
      <div class="result-attendee" id="result-attendee"></div>
      <div class="result-meta" id="result-meta"></div>
      <div class="result-countdown" id="result-countdown"></div>
    </div>
  </div>

  <script src="../js/scanner.js"></script>
</body>
</html>
